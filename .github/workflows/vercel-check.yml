name: Vercel frontend build verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python for supplier feed preview tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python supplier bot tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Install Deno for Supabase Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check approved supplier photo importer
        run: deno check supabase/functions/approved-photo-import/index.ts
      - name: Check full-source catalogue importer
        run: deno check supabase/functions/approved-catalog-bulk/index.ts
      - name: Install dependencies
        working-directory: apps/storefront
        run: npm install --no-audit --no-fund
      - name: Syntax verification
        working-directory: apps/storefront
        run: npm run check
      - name: Product editor unit tests
        working-directory: apps/storefront
        run: npm test
      - name: Photo importer frontend syntax
        working-directory: apps/storefront
        run: node --check src/photo-review.js
      - name: Bulk importer frontend syntax
        working-directory: apps/storefront
        run: node --check src/bulk-import.js
      - name: Build storefront + admin
        working-directory: apps/storefront
        run: npm run build
      - name: Check production output
        run: |
          test -s apps/storefront/dist/index.html
          test -s apps/storefront/dist/admin.html
          test ! -e apps/storefront/dist/register.html
          test -d apps/storefront/dist/assets
